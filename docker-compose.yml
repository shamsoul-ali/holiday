services:
  db:
    image: postgres:15
    container_name: holiday_db
    environment:
      POSTGRES_DB: holiday_ai
      POSTGRES_USER: holiday_user
      POSTGRES_PASSWORD: holiday_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U holiday_user -d holiday_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: holiday_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    container_name: holiday_api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://holiday_user:holiday_pass@db:5432/holiday_ai
      - REDIS_URL=redis://redis:6379
      - OPENAI_API_KEY=your_openai_api_key_here
      - "AMADEUS_CLIENT_ID=your_amadeus_client_id_here"
      - "AMADEUS_CLIENT_SECRET=your_amadeus_client_secret_here"
      - "AMADEUS_ENVIRONMENT=test"
      - "OPENWEATHER_API_KEY=your_openweather_api_key_here"
      - "GOOGLE_PLACES_API_KEY=your_google_places_api_key_here"
      - "GOOGLE_MAPS_API_KEY=your_google_maps_api_key_here"
    # env_file:
    #   - .env
    volumes:
      - ./apps/api:/app
      - /app/__pycache__
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    container_name: holiday_web
    ports:
      - "3010:3010"
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8000
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api
    command: npm run dev

volumes:
  postgres_data:
  redis_data:
